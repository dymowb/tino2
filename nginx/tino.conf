server {
    listen 80;
    server_name _;

    # Serve React build
    root /home/dymowb/dev/tino2/frontend/build;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Proxy API + WebSocket to Express
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Message attachments are private. They are served only by the authenticated
    # API route, which checks conversation membership. This must stay above the
    # /uploads/ block — legacy attachments still live on disk under this path and
    # would otherwise be readable by anyone holding the URL.
    location /uploads/messages/ {
        return 404;
    }

    # Uploaded files (public assets: profile images, portfolios)
    location /uploads/ {
        alias /home/dymowb/dev/tino2/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # React client-side routing — all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
