# Pinned so every checkout/worktree of this repo shares one Compose project.
# Without it the project name defaults to the directory name, and sibling
# worktrees collide on the hardcoded container_name values below.
name: tino2

services:
  postgres-app:
    image: postgres:16
    container_name: tino2-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tino
      POSTGRES_PASSWORD: tino
      POSTGRES_DB: tino_app
    ports:
      - '5432:5432'
    volumes:
      - app-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tino -d tino_app']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-memory:
    image: pgvector/pgvector:pg16
    container_name: tino2-memory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tino
      POSTGRES_PASSWORD: tino
      POSTGRES_DB: tino_memory
    ports:
      - '5433:5432'
    volumes:
      - memory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tino -d tino_memory']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16
    container_name: tino2-test-db
    environment:
      POSTGRES_USER: tino_test
      POSTGRES_PASSWORD: tino_test
      POSTGRES_DB: tino_test
    ports:
      - '5434:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tino_test -d tino_test']
      interval: 2s
      timeout: 3s
      retries: 15

  postgres-memory-test:
    image: pgvector/pgvector:pg16
    container_name: tino2-memory-test-db
    environment:
      POSTGRES_USER: tino_memory_test
      POSTGRES_PASSWORD: tino_memory_test
      POSTGRES_DB: tino_memory_test
    ports:
      - '5435:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tino_memory_test -d tino_memory_test']
      interval: 2s
      timeout: 3s
      retries: 15

  adminer:
    image: adminer
    container_name: tino2-adminer
    ports:
      - '8080:8080'
    depends_on:
      - postgres-app
      - postgres-memory

volumes:
  app-pgdata:
  memory-pgdata:
