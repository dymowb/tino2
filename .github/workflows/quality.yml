name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:16
        env:
          POSTGRES_USER: tino_test
          POSTGRES_PASSWORD: tino_test
          POSTGRES_DB: tino_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U tino_test -d tino_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      postgres-memory:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tino_memory_test
          POSTGRES_PASSWORD: tino_memory_test
          POSTGRES_DB: tino_memory_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U tino_memory_test -d tino_memory_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      CI: "true"
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://tino_test:tino_test@127.0.0.1:5434/tino_test
      MEMORY_DATABASE_URL: postgresql://tino_memory_test:tino_memory_test@127.0.0.1:5435/tino_memory_test
      JWT_SECRET: ci-only-secret-that-is-never-used-outside-tests
      REDIS_ENABLED: "false"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Dependency security
        run: |
          npm audit --omit=dev --omit=optional --audit-level=high
          npm audit --prefix backend --omit=dev --omit=optional --audit-level=high

      - name: Backend quality and integration tests
        run: |
          npm run typecheck --prefix backend
          npm run format:check --prefix backend
          npm run lint --prefix backend
          npm test --prefix backend

      - name: Frontend unit tests and build
        run: |
          npm test --prefix frontend
          npm run build --prefix frontend

      # All five projects defined in playwright.config.ts. Running only Chromium
      # meant Firefox, WebKit and both mobile profiles were declared but never
      # exercised, so a browser-specific regression could not be caught here.
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start product servers
        env:
          PORT: "3100"
          DATABASE_URL: postgresql://tino_test:tino_test@127.0.0.1:5434/tino_test
          ALLOWED_ORIGINS: http://127.0.0.1:3101,http://localhost:3101
          VITE_PROXY_TARGET: http://127.0.0.1:3100
          VITE_PORT: "3101"
          REBOOK_AI_MODEL_CHAIN: anthropic:test-model
          AI_FAST_MODEL_CHAIN: anthropic:test-fast
          AI_REASONING_MODEL_CHAIN: anthropic:test-reasoning
          AI_SYNTHESIS_MODEL_CHAIN: anthropic:test-synthesis
          AI_EMBEDDING_CHAIN: openai:test-embedding
          AI_EMBEDDING_DIMENSIONS: "1024"
        run: |
          mkdir -p test-results/server-logs
          (cd backend && npm run migration:run && npm run seed && npm run dev) \
            > test-results/server-logs/backend.log 2>&1 &
          (cd frontend && npm run dev) \
            > test-results/server-logs/frontend.log 2>&1 &

          servers_ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/health > /dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:3101 > /dev/null; then
              servers_ready=1
              break
            fi
            sleep 2
          done

          if [ "$servers_ready" -ne 1 ]; then
            echo "Backend server log:"
            tail -n 200 test-results/server-logs/backend.log
            echo "Frontend server log:"
            tail -n 200 test-results/server-logs/frontend.log
            exit 1
          fi

      - name: Product suite (Chromium, Firefox, WebKit, Mobile Chrome, Mobile Safari)
        env:
          PLAYWRIGHT_REUSE_SERVERS: "true"
        run: npm run test:ci

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results/
            Tests/results/
