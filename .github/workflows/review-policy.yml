name: Review Policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-policy:
    name: review-policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce conditional approval policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Self-authored PRs still require CI, but do not require a second reviewer.
            const ownerLogin = 'dymowb';
            const pullRequest = context.payload.pull_request;

            if (!pullRequest) {
              core.setFailed('This workflow must run for a pull request event.');
              return;
            }

            const authorLogin = pullRequest.user.login;
            if (authorLogin.toLowerCase() === ownerLogin.toLowerCase()) {
              core.info(`Approval is optional for pull requests opened by ${ownerLogin}.`);
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });

            const headSha = pullRequest.head.sha;

            const latestReviewByUser = new Map();
            for (const review of reviews) {
              const reviewer = review.user?.login;
              if (!reviewer || reviewer.toLowerCase() === authorLogin.toLowerCase()) continue;

              const previous = latestReviewByUser.get(reviewer.toLowerCase());
              if (!previous || review.id > previous.id) {
                latestReviewByUser.set(reviewer.toLowerCase(), review);
              }
            }

            const latestReviews = [...latestReviewByUser.values()];
            const approvals = latestReviews.filter((review) => review.state === 'APPROVED');

            // An approval is of a diff, not of a pull request. Without this the
            // reviewer's verdict on one commit silently carried over to whatever
            // was pushed afterwards, which is the same as not requiring review for
            // any change made after the first approval.
            const currentApprovals = approvals.filter((review) => review.commit_id === headSha);
            const staleApprovals = approvals.filter((review) => review.commit_id !== headSha);

            if (currentApprovals.length === 0) {
              if (staleApprovals.length > 0) {
                const names = staleApprovals.map((review) => review.user.login).join(', ');
                core.setFailed(
                  `Approval from ${names} was given for an earlier commit and does not cover ${headSha.slice(0, 7)}. ` +
                    'Request a fresh review after the latest push.'
                );
                return;
              }

              core.setFailed(`Pull requests opened by ${authorLogin} require one approval from another user.`);
              return;
            }

            const approvers = currentApprovals.map((review) => review.user.login);
            core.info(`Approval requirement satisfied for ${headSha.slice(0, 7)} by ${approvers.join(', ')}.`);
